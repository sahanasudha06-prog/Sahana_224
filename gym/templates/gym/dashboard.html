
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Membership Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 40px;
            color: #1e293b;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        .header {
            background: #1e293b;
            color: white;
            padding: 28px;
            border-radius: 12px;
        }
        .cards {
            display: flex;
            gap: 20px;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            flex: 1;
            min-width: 200px;
            box-shadow: 0 3px 12px #00000010;
        }
        .number {
            font-size: 36px;
            color: #2563eb;
            font-weight: bold;
        }
        a {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            text-decoration: none;
            border-radius: 7px;
            margin: 5px 8px 5px 0;
        }
        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gym & Fitness Center</h1>
            <p>Gym Membership Management Dashboard</p>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Total Members</h3>
                <div class="number">{{ total_members }}</div>
            </div>

            <div class="card">
                <h3>Active Members</h3>
                <div class="number">{{ active_members }}</div>
            </div>
        </div>

        <div class="card">
            <h2>Member Management</h2>
            <p>Manage your gym members and memberships here.</p>
            <a href="{% url 'member_list' %}">View Members</a>
            <a href="{% url 'add_member' %}">Add New Member</a>
        </div>
    </div>
</body>
</html>
